apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse-ds
    access: proxy
    isDefault: true
    jsonData:
      defaultDatabase: bigdata
      port: 8123
      protocol: http
      server: clickhouse
      username: ${CH_USER}
    secureJsonData:
      password: ${CH_PASSWORD}