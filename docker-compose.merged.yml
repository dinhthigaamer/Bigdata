services:
  # ---------------------------------------------------------------------------
  # Kafka (KRaft, single node)
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft configuration
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Listeners
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # KRaft quorum
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Single-node configuration
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - kafka-docker_default
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Spark speed layer
  # ---------------------------------------------------------------------------
  spark-speed:
    build:
      context: .
      dockerfile: speed/Dockerfile
    container_name: spark-speed
    depends_on:
      - kafka
    ports:
      - "4040:4040"
    environment:
      PYTHONPATH: /app
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    command:
      - python
      - -m
      - speed.jobs.job_a_console
      - --kafka
      - ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - --checkpoint
      - /checkpoints/job_a_console
    volumes:
      - .:/app
      - spark_checkpoints:/checkpoints
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - kafka-docker_default
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # ClickHouse
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    environment:
      CLICKHOUSE_DB: bigdata
      CLICKHOUSE_USER: ${CH_USER:-bigdata}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:-bigdata123}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123" # HTTP (thư viện ghi dùng cổng này)
      - "9000:9000" # native
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro # chỉ chạy lần đầu volume trống
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - kafka-docker_default

  # ---------------------------------------------------------------------------
  # Grafana
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_SECURITY_ADMIN_USER: ${GF_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_PASSWORD:-admin}
      CH_USER: ${CH_USER:-bigdata}
      CH_PASSWORD: ${CH_PASSWORD:-bigdata123}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - kafka-docker_default

networks:
  kafka-docker_default:
    name: ${DOCKER_NETWORK:-kafka-docker_default}

volumes:
  kafka_data:
  spark_checkpoints:
    name: spark_checkpoints
  clickhouse_data:
  grafana_data:
